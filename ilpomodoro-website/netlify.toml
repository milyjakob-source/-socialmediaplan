# Netlify: veröffentlicht den Ordner public/ so, wie er im Repo liegt (kein Build-Schritt nötig).
# Base directory in Netlify: leer lassen (Repo-Wurzel)
[build]
  publish = "public"
  command = ""

# HTTPS und die Weiterleitung zwischen ilpomodorosued.de und www.ilpomodorosued.de übernimmt Netlify
# selbst: unter Domain management die www-Adresse als „Primary domain“ setzen, HTTPS ist automatisch an.

# Adressen der alten Website (Jimdo), damit Google-Treffer und Lesezeichen weiter funktionieren.
[[redirects]]
  from = "/wochen-und-speisekarte"
  to = "/speisekarte/"
  status = 301
[[redirects]]
  from = "/wochen-und-speisekarte/*"
  to = "/speisekarte/"
  status = 301
# Online-Reservierung gibt es nicht mehr: alte Links führen zu Kontakt (Telefon).
[[redirects]]
  from = "/reservierung/*"
  to = "/kontakt/"
  status = 301
[[redirects]]
  from = "/reservierung"
  to = "/kontakt/"
  status = 301
[[redirects]]
  from = "/wochenkarte"
  to = "https://www.instagram.com/ilpomodorosud/"
  status = 301

# Sicherheits-Header für alle Seiten.
[[headers]]
  for = "/*"
  [headers.values]
    Strict-Transport-Security = "max-age=63072000; includeSubDomains; preload"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), interest-cohort=()"
    Cross-Origin-Opener-Policy = "same-origin"
    Content-Security-Policy = "default-src 'self'; script-src 'self' https://www.googletagmanager.com; style-src 'self'; img-src 'self' data: https://*.googleusercontent.com https://www.google-analytics.com https://*.google-analytics.com https://www.googletagmanager.com; font-src 'self'; connect-src 'self' https://script.google.com https://script.googleusercontent.com https://docs.google.com https://*.googleusercontent.com https://*.google-analytics.com https://*.analytics.google.com https://www.googletagmanager.com; frame-src https://www.google.com https://maps.google.com; form-action 'self'; base-uri 'self'; frame-ancestors 'none'; object-src 'none'; upgrade-insecure-requests"

# Lange Zwischenspeicherung für Schriften und Bilder; CSS und JS tragen ?v= und dürfen ebenfalls lange.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
[[headers]]
  for = "/assets/img/fotos/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000"
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
